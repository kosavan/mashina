name: Publish MASHINA container

on:
  pull_request:
    paths:
      - .github/workflows/publish-image.yml
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - compose.registry.yml
      - tools/check_container_image.sh
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag, such as v1.13.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mashina-container-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kosavan/mashina

jobs:
  source:
    if: >-
      github.event_name == 'pull_request' ||
      (github.repository == 'kosavan/mashina' &&
        ((github.event_name == 'release' && !github.event.release.prerelease) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Require passing MASHINA checks on the exact stable release commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v1.13.0.' >&2
            exit 1
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '(.draft == false) and (.prerelease == false)')" = true
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          run_url=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$commit" \
            --jq '.workflow_runs[0].html_url // empty')
          if [[ -z "$run_url" ]]; then
            echo "MASHINA checks must pass on main at $commit before publishing $TAG." >&2
            exit 1
          fi
          printf 'commit=%s\nversion=%s\n' "$commit" "${TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'Source: `%s`\n\n[Exact-source MASHINA checks](%s)\n' "$commit" "$run_url" >> "$GITHUB_STEP_SUMMARY"

  verify-image:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      COMMIT: ${{ needs.source.outputs.commit }}
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: checks
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.commit }}
          path: source
      - name: Build from the verified commit
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          project_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -z "$VERSION" || test "$VERSION" = "$project_version"
          docker build --platform "linux/$ARCH" -t "mashina:verified-$ARCH" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.version=$project_version" .
          test "$(docker image inspect "mashina:verified-$ARCH" --format '{{.Os}}/{{.Architecture}}')" = "linux/$ARCH"
      - name: Check registry Compose settings against the source-build settings
        working-directory: checks
        env:
          MASHINA_IMAGE: mashina:verified-${{ matrix.arch }}
        run: |
          docker compose -f docker-compose.yml config --format json > source-compose.json
          docker compose -f compose.registry.yml config --format json > registry-compose.json
          jq -e --arg image "$MASHINA_IMAGE" \
            '.services.mashina | .image == $image and (has("build") | not)' registry-compose.json
          diff -u <(jq -S 'del(.services.mashina.build)' source-compose.json) \
            <(jq -S 'del(.services.mashina.image)' registry-compose.json)
      - name: Check startup, non-root backup and restore, and local OCR
        run: bash checks/tools/check_container_image.sh "mashina:verified-$ARCH" source
      - name: Save the tested image
        if: github.event_name != 'pull_request'
        run: docker image save "mashina:verified-$ARCH" | gzip -1 > "mashina-$ARCH.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: mashina-verified-${{ matrix.arch }}
          path: mashina-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  publish:
    if: github.event_name != 'pull_request'
    needs: [source, verify-image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      COMMIT: ${{ needs.source.outputs.commit }}
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mashina-verified-*
          path: verified
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and verify the versioned multi-platform image
        run: |
          target="$IMAGE:$VERSION"
          source_images=()
          for arch in amd64 arm64; do
            local_image="mashina:verified-$arch"
            docker image load --input "verified/mashina-verified-$arch/mashina-$arch.tar.gz"
            test "$(docker image inspect "$local_image" --format '{{.Os}}/{{.Architecture}}')" = "linux/$arch"
            test "$(docker image inspect "$local_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT"
            candidate="$IMAGE:$VERSION-$arch-$GITHUB_RUN_ID"
            docker image tag "$local_image" "$candidate"
            docker image push "$candidate"
            digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$candidate")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            source_images+=("$IMAGE@$digest")
          done

          if ! docker buildx imagetools inspect --raw "$target" > manifest.json 2> inspect-error; then
            if ! grep -Eqi 'not found|manifest unknown|name unknown' inspect-error; then
              cat inspect-error >&2
              exit 1
            fi
            # Engine pushes can produce Docker manifests, whose index does not support OCI annotations.
            docker buildx imagetools create --tag "$target" "${source_images[@]}"
            docker buildx imagetools inspect --raw "$target" > manifest.json
          fi

          # Confirm existing tags without replacing them. Read the commit and version from both image configs.
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          for arch in amd64 arm64; do
            digest=$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' manifest.json)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect --format '{{json .Image}}' "$IMAGE@$digest" |
              jq -e --arg commit "$COMMIT" --arg version "$VERSION" \
                '.config.Labels | .["org.opencontainers.image.revision"] == $commit and .["org.opencontainers.image.version"] == $version'
          done
          published_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$target")
          [[ "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Image: `%s`\n\nDigest: `%s@%s`\n' "$target" "$IMAGE" "$published_digest" >> "$GITHUB_STEP_SUMMARY"
