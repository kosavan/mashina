name: MASHINA checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
concurrency:
  group: mashina-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: uv run python tools/check_secrets.py
      - run: uv run python tools/check_docs.py
      - run: uv run python tools/check_migrations.py
      - name: Local OCR engine and PDF renderer
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng poppler-utils
      - run: uv run ruff check backend && uv run pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - run: docker build -t mashina:verify .
      - name: Container health and persistent initialization
        run: |
          docker run -d --name mashina-check --read-only --tmpfs /tmp:rw,size=128m --mount type=volume,source=mashina-ci-data,target=/app/data -p 8000:8000 mashina:verify
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs mashina-check
          exit 1
      - name: Backup and restore on the persistent writable volume
        run: docker exec -i mashina-check /app/.venv/bin/python < tools/check_container_restore.py
      - name: Local OCR inside the non-root production container
        run: |
          docker exec -i mashina-check /app/.venv/bin/python - <<'PY'
          import io
          from PIL import Image, ImageDraw, ImageFont
          from backend.ocr import recognize
          image = Image.new('RGB', (1400, 500), 'white')
          font = ImageFont.truetype('backend/assets/fonts/Manrope-Regular.ttf', 40)
          ImageDraw.Draw(image).text((60, 40), 'TOTAL 1234.56', fill='black', font=font)
          for format in ('PNG', 'PDF'):
              buffer = io.BytesIO()
              image.save(buffer, format=format, resolution=150)
              result = recognize(buffer.getvalue(), 'receipt', 1)
              assert result['engine'] == 'tesseract-local'
              assert result['fields']['amount'] == '1234.56', result
          print('Production container: actual image and PDF OCR passed')
          PY
