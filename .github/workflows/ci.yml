name: MASHINA checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
concurrency:
  group: mashina-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev --extra recognition
      - run: uv run python tools/check_secrets.py
      - run: uv run ruff check backend && uv run pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - run: docker build -t mashina:verify .
      - name: Container health and persistent initialization
        run: |
          docker run -d --name mashina-check -p 8000:8000 mashina:verify
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs mashina-check
          exit 1
      - name: Optional PDF renderer image
        run: |
          docker build --build-arg MASHINA_RECOGNITION=1 -t mashina:recognition .
          docker run --rm --entrypoint /app/.venv/bin/python mashina:recognition -c "import pypdfium2; print(pypdfium2.PYPDFIUM_INFO.version)"
