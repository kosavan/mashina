name: Publish MASHINA website
on:
  workflow_run:
    workflows: [MASHINA checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mashina-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/check_docs.py
      - run: python tools/check_migrations.py
      - run: python tools/check_secrets.py
      - run: python tools/build_site.py
      - run: python tools/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked source
        id: deployment
        uses: actions/deploy-pages@v4
