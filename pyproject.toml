[project]
name = "mashina"
version = "1.10.0"
description = "Private self-hosted vehicle management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "argon2-cffi>=23.1,<26",
    "python-multipart>=0.0.20,<1",
    "pillow>=11,<13",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.15,<2",
    "pydantic>=2.10,<3",
    "reportlab>=4.4,<5",
    "pywebpush>=2,<3",
    "filelock>=3.20,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pypdf>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

